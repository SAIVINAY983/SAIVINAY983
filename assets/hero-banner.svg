<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="260" role="img" aria-label="B Sai Vinay - Full Stack Developer &amp; Software Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="25%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowViolet" cx="78%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#8B5CF6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>

    <clipPath id="rounded">
      <rect x="0" y="0" width="1200" height="260" rx="14" ry="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="260" fill="url(#bgGrad)" />
    <rect width="1200" height="260" fill="url(#grid)" />
    <rect width="1200" height="260" fill="url(#glowCyan)" />
    <rect width="1200" height="260" fill="url(#glowViolet)" />

    <!-- Subtle glass border -->
    <rect x="1" y="1" width="1198" height="258" rx="13" ry="13" fill="none" stroke="#1E293B" stroke-width="1.5" />

    <!-- Top status pill -->
    <rect x="442" y="48" width="316" height="30" rx="15" fill="#111827" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <circle cx="462" cy="63" r="4" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="608" y="67.5" text-anchor="middle" fill="#CBD5E1" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6">
      FULL STACK DEVELOPER · ENGINEER
    </text>

    <!-- Main Name -->
    <text x="600" y="142" text-anchor="middle" fill="url(#titleGrad)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="3">
      B SAI VINAY
    </text>

    <!-- Subtitle -->
    <text x="600" y="180" text-anchor="middle" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="0.4">
      Scalable Web Applications · Backend Architecture · AI-Powered Systems
    </text>

    <!-- Bottom animated accent line -->
    <rect x="260" y="218" width="680" height="2" rx="1" fill="url(#accentLine)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3.5s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
